[project]
name = "data-efficient-roof-segmentation"
version = "0.1.0"
description = "A reproducible study of label efficiency for geographic roof segmentation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ipykernel>=6.30,<7",
  "matplotlib>=3.10,<4",
  "nbclient>=0.10,<0.11",
  "nbconvert>=7.16,<8",
  "nbformat>=5.10,<6",
  "numpy>=2.2,<3",
  "pandas>=2.3,<3",
  "pillow>=11.3,<13",
  "pyproj>=3.7,<4",
  "rasterio>=1.4,<2",
  "shapely>=2.1,<3",
  "torch==2.8.0",
  "torchvision==0.23.0",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roofseg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
